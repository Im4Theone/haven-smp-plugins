name: SMP-Market
version: '${version}'
main: net.kaloyan.smpmarket.SMPMarket
api-version: '1.21.11'
description: Player auction house for the SMP - command-driven listings with crash-recoverable purchases and item delivery.
authors: [im4theone]
depend: [SMP-Core, SMP-Economy]

# Commands are registered through Paper's Brigadier lifecycle API (see MarketCommands),
# so there is intentionally no "commands:" section here.

permissions:
  smpmarket.use:
    description: Use /market, /market browse, /market listings and /market history.
    default: true
  smpmarket.sell:
    description: List items for sale (/market sell).
    default: true
  smpmarket.buy:
    description: Buy listings (/market buy).
    default: true
  smpmarket.cancel:
    description: Cancel your own listings (/market cancel).
    default: true
  smpmarket.collect:
    description: Collect returned items and purchases (/market collect).
    default: true
  smpmarket.admin.inspect:
    description: Inspect any listing, transaction and delivery (/market admin listings|listing|tx|issues).
    default: op
  smpmarket.admin.cancel:
    description: Cancel any player's active listing (/market admin cancel <id> <reason>). The item goes to its owner.
    default: op
  smpmarket.admin.recover:
    description: Run recovery and resolve uncertain states (/market admin recover|resolve).
    default: op
  smpmarket.admin.reload:
    description: Reload config.yml (/market admin reload).
    default: op
  smpmarket.admin:
    description: Every administrative SMP-Market permission.
    default: op
    children:
      smpmarket.admin.inspect: true
      smpmarket.admin.cancel: true
      smpmarket.admin.recover: true
      smpmarket.admin.reload: true
