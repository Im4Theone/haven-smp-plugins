# SMP-Auction. Texts use MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Changing config-version or removing it makes the plugin replace this file with the built-in one (your copy is kept).
config-version: 2

auction:
  # Lengths offered in the sell menu (up to 7), in hours.
  durations: [6, 12, 24, 48, 72, 168]
  # Length used by /ah sell. Must be one of the durations.
  default-duration-hours: 48
  # Price limits for a whole listing (at most 2 decimals). The 'k', 'm' and 'b' shorthands work when typing prices.
  min-price: 10
  max-price: 1000000000
  # How many live listings a player can have, and permissions that raise it (0 = unlimited).
  max-listings: 5
  limit-permissions:
    smpauction.limit.10: 10
    smpauction.limit.25: 25
    smpauction.limit.50: 50
    smpauction.limit.100: 100
    smpauction.limit.unlimited: 0

# Auctions with bids, next to Buy It Now.
bidding:
  enabled: true
  # A new bid must beat the current one by this percent or this amount, whichever is higher.
  min-increment-percent: 5
  min-increment: 1
  # A bid in the final seconds extends the auction to this many seconds, so nobody wins by sniping (0 = off).
  anti-snipe-seconds: 30

economy:
  # Taken from the seller's money when an item sells.
  sales-tax-percent: 5
  # Paid by the seller when listing, and not refunded.
  listing-fee:
    flat: 0
    percent: 0
    # Highest fee for one listing (0 = no cap).
    max: 0

restrictions:
  # Worlds where players cannot list items.
  disabled-worlds: []
  # Game modes that cannot list items (stops creative-mode items reaching the economy).
  blocked-gamemodes: [CREATIVE, SPECTATOR]

# Items that can never be listed.
blacklist:
  materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK
    - LIGHT
    - KNOWLEDGE_BOOK

titles:
  browse: "<#FBBF24>ᴀᴜᴄᴛɪᴏɴ ʜᴏᴜꜱᴇ (ᴘᴀɢᴇ <page>)"
  confirm: "<#FBBF24>ᴄᴏɴꜰɪʀᴍ ᴘᴜʀᴄʜᴀꜱᴇ"
  bid: "<#FBBF24>ᴘʟᴀᴄᴇ ᴀ ʙɪᴅ"
  mine: "<#FBBF24>ʏᴏᴜʀ ʟɪꜱᴛɪɴɢꜱ"
  collect: "<#FBBF24>ᴄᴏʟʟᴇᴄᴛɪᴏɴ ʙᴏx"
  history: "<#FBBF24>ʏᴏᴜʀ ꜱᴀʟᴇꜱ ᴀɴᴅ ᴘᴜʀᴄʜᴀꜱᴇꜱ"
  sell: "<#FBBF24>ꜱᴇʟʟ ᴀɴ ɪᴛᴇᴍ"

