# SMP-Kits: one kit per rank. Texts use MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Changing config-version or removing it makes the plugin replace this file with the built-in one (your copy is kept).
config-version: 8

# Players whose main rank (LuckPerms primary group) is listed here get no kits at all: this is the Admin (Guardian) rank.
# The Founder plays too, so the Founder gets kits.
excluded-groups: [guardian]

# A kit is available to players with the permission smpkits.kit.<kit id>. Ranks inherit the permissions of the ranks below them in
# LuckPerms, so a Beacon can also claim the Settler and Keeper kits (the lines to set this up are in LuckPerms-setup/haven-new-plugins.txt).
# cooldown: how long until the kit can be claimed again (24h for most kits, 3d for the netherite kits Lookout and Warden). A length of time (30m, 12h, 3d, 1w) or "once" for a one-time kit.

titles:
  main: "<#FBBF24>ʀᴀɴᴋ ᴋɪᴛꜱ"
  preview: "<#FBBF24>ᴋɪᴛ: <kit>"

messages:
  claimed: "<white>You claimed the <kit><white>. Next one in <cooldown>."
  claimed-once: "<white>You claimed the <kit><white>."
  cooldown: "<red>You can claim the <kit><red> again in <white><remaining></white>."
  already-once: "<red>You have already claimed the <kit><red>; it can only be claimed once."
  no-permission: "<red>You don't have access to that kit."
  excluded: "<red>Your rank gets no kits."
  unknown: "<red>There is no kit called <white><name></white>."
  no-space: "<red>You need more room in your inventory (<white><needed></white> more free slot(s)). Nothing was claimed."
  saved-failed: "<red>That could not be saved, so nothing was claimed."
  none: "<red>You have no kit available."
  admin-given: "<green>Gave the <kit><green> to <white><player></white>."
  admin-reset: "<green>Reset the cooldown of <white><player></white> for <kit><green>."
  usage: "<red>Usage: <usage>"

