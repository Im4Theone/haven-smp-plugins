# SMP-Shop. Texts use MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Changing config-version or removing it makes the plugin replace this file with the built-in one (your copy is kept).
config-version: 3

titles:
  main: "<gradient:#00F986:#5EEAD4>ꜱʜᴏᴘ</gradient>"
  shards: "<gradient:#A303F9:#5EEAD4>ꜱʜᴏᴘ - ꜱʜᴀʀᴅꜱ</gradient>"
  shard-name: "<#A303F9>ꜱʜᴀʀᴅ ꜱʜᴏᴘ"
  back: "<#fd0100>Back"
  cancel: "<#fd0100>Cancel"
  confirm: "<#01fc01>Confirm"

messages:
  bought-item: "<white>You bought <#00a4fc><amount> <item></#00a4fc> for <#00fc00><price></#00fc00>"
  bought-offer: "<white>You bought <#00a4fc><amount> <item></#00a4fc> for <#5EEAD4><price></#5EEAD4>"
  not-enough-money: "<red>You don't have enough money."
  not-enough-shards: "<red>You don't have enough shards."
  inventory-full: "<red>Your inventory is full. You were not charged."
  payment-unsure: "<red>The payment could not be confirmed. You were not given the item; check your balance and tell an admin."
  unavailable: "<red>That is unavailable right now. You were not charged."
  shard-found: "<white>You found <#5EEAD4>1 Shard</#5EEAD4>! You now have <#5EEAD4><total></#5EEAD4>."
  shards-balance: "<white>You have <#5EEAD4><shards> Shards</#5EEAD4>."

# Shards: the currency of the shard shop (separate from money).
shards:
  # Every this many minutes each online player rolls for a shard.
  interval-minutes: 10
  # Chance (0-100) that a roll gives exactly 1 shard. 100 = everyone gets one every interval.
  chance-percent: 50

# The money shop. Prices are for ONE item. slot is the place on the main menu (0-26). Up to 36 items per category.
