# The shard shop. Keys need SMP-Crates (id = the crate id), spawners need SMP-Spawners (creature = a creature in its config).
# At most 5 keys and 9 spawners. Prices are whole shards.
shard-shop:
  keys:
    - {id: common, name: "<#9CA3AF>Common Key", icon: TRIPWIRE_HOOK, price: 200}
    - {id: prime, name: "<#38BDF8>Prime Key", icon: TRIPWIRE_HOOK, price: 1500}
    - {id: gold, name: "<#FBBF24>Gold Key", icon: TRIPWIRE_HOOK, price: 1500}
    - {id: amethyst, name: "<#F472B6>Amethyst Key", icon: TRIPWIRE_HOOK, price: 4000}
    - {id: crimson, name: "<#F87171>Crimson Key", icon: TRIPWIRE_HOOK, price: 2000}
  spawners:
    - {creature: PIG, name: "<white>Pig Spawner", icon: PIG_SPAWN_EGG, price: 250}
    - {creature: COW, name: "<white>Cow Spawner", icon: COW_SPAWN_EGG, price: 350}
    - {creature: ZOMBIE, name: "<green>Zombie Spawner", icon: ZOMBIE_SPAWN_EGG, price: 400}
    - {creature: SPIDER, name: "<dark_gray>Spider Spawner", icon: SPIDER_SPAWN_EGG, price: 750}
    - {creature: SKELETON, name: "<gray>Skeleton Spawner", icon: SKELETON_SPAWN_EGG, price: 500}
    - {creature: CREEPER, name: "<dark_green>Creeper Spawner", icon: CREEPER_SPAWN_EGG, price: 625}
    - {creature: BLAZE, name: "<gold>Blaze Spawner", icon: BLAZE_SPAWN_EGG, price: 1000}
    - {creature: IRON_GOLEM, name: "<gray>Iron Golem Spawner", icon: IRON_GOLEM_SPAWN_EGG, price: 1500}
