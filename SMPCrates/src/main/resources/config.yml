# SMP-Crates configuration. A "key" is a virtual key kept on the player's account (no item), opened with /keys (or /crates). Apply changes with "/crates reload" (an invalid file is rejected and the old settings stay).
#
# Colours/format: MiniMessage. Reward types:
#   item     material, amount (up to 2304), name (optional), enchantments (optional: sharpness: 5)
#   money    amount - paid through Vault, i.e. your SMP-Economy
#   shards   amount - needs DonutShop (the shard currency)
#   command  command (run by the console, %player% = the winner), material and name for the menu
# Every reward has a weight: a reward with weight 20 comes up twice as often as one with weight 10. "broadcast: true" tells
# the whole server when somebody wins it.

# KEYALL: when the timer reaches 0:00 every player who is online gets one crate, and the timer starts again at 60:00. The timer is
# the server's clock (UTC): with 60 minutes a new round starts on every full hour, for all players at the same moment, and it
# does not restart when the server does. The scoreboard shows it with <crate_timer> (SMP-Scoreboard).
hourly:
  enabled: true
  crate: common
  interval-minutes: 60
  # false = only the players online at 0:00 get the key (a real keyall). true = a player who was offline during a round
  # also gets that round's crate when they join (never more than one at a time).
  catch-up: false

# /keyall <crate> [amount] gives every player who is online a crate. Nobody has the permission smpcrates.keyall by default (not even
# operators): give it to yourself with LuckPerms. As a second lock, list the player names that may use it; with an empty list anybody who
# has the permission may. The console can always use it.
keyall:
  allowed-players: []

